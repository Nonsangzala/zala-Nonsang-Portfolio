<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonsang - Full Stack Web Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hero.css">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero__container">
            <!-- Left Content -->
            <div class="hero__content">
                <!-- Badge -->
                <div class="hero__badge">
                    <span class="badge__text">HELLO, I'M</span>
                </div>

                <!-- Main Heading -->
                <h1 class="hero__title">
                    Nonsang
                </h1>

                <!-- Subtitle with highlighted text -->
                <p class="hero__subtitle">
                    Full Stack <span class="highlight">Web Developer</span>
                </p>

                <!-- Description -->
                <p class="hero__description">
                    I build fast, modern and responsive websites that help businesses grow.
                </p>

                <!-- Call-to-Action Buttons -->
                <div class="hero__buttons">
                    <button class="btn btn--primary" aria-label="Hire Me">
                        <i class="fas fa-paper-plane"></i>
                        <span>Hire Me</span>
                    </button>
                    <button class="btn btn--secondary" aria-label="Download Resume">
                        <i class="fas fa-download"></i>
                        <span>Download Resume</span>
                    </button>
                </div>
            </div>

            <!-- Right Side - Profile Image -->
            <div class="hero__image">
                <div class="hero__image-frame">
                    <img src="assets/hero-photo.jpg" alt="Nonsang profile" class="hero__photo">
                    <div class="hero__image-glow" aria-hidden="true"></div>
                </div>
                <p class="hero__image-note">Place your image file at <code>frontend/assets/hero-photo.jpg</code>.</p>
            </div>
        </div>
    </section>

    <!-- Script -->
    <script src="hero.js"></script>
</body>
</html>
